<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5faff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b1730" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Download EMASS SDKs, drivers, and integration resources." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      try {
        const theme = localStorage.getItem("emass-theme")
        const isDark = theme === "dark"
        document.documentElement.classList.toggle("dark", isDark)
        document.documentElement.style.colorScheme = isDark ? "dark" : "light"
      } catch {
        document.documentElement.style.colorScheme = "light"
      }
    </script>
    <title>EMASS Portal · SDK Downloads</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
